name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: extraction pipeline (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        run: |
          bash --version | head -1
          python3 -V
          tar --version | head -1
          xz --version | head -1

      - name: Shell syntax check
        run: |
          for f in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Python syntax check
        run: |
          python3 -m compileall -q scripts tools && echo "ok  python"

      - name: Run self-test suite
        run: ./scripts/tests/run-tests.sh

      - name: Verify vendored oracle is unmodified
        run: |
          expected="600d1cab2fc7de5127fb287f4e2791718db54efb1102d0f365db0d3ec1ccf62e"
          actual="$(sha256sum tools/vendor/lpunpack.py | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "vendored lpunpack.py changed: $actual" >&2
            exit 1
          fi
          echo "oracle checksum ok"

      - name: Verify device.json references resolve
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path(".")
          d = json.loads((root / "firmware/device.json").read_text())
          vl = root / "firmware" / d["vendor_list"]
          assert vl.is_file(), f"missing {vl}"
          names = [l.strip() for l in vl.read_text().splitlines()
                   if l.strip() and not l.lstrip().startswith("#")]
          assert names, "vendor list is empty"
          assert "vendor" in names, "vendor list must contain 'vendor'"
          for url in [d["rom_url"], *d["rom_url_mirrors"]]:
              assert url.startswith("https://"), url
          print(f"ok  {len(names)} partitions, {len(d['rom_url_mirrors'])} mirrors")
          PY
