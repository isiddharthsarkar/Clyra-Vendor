name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner + disk
        run: |
          set -x
          uname -a; nproc; free -g; df -h /
          python3 -V; zstd --version; xz --version | head -1; tar --version | head -1
      - name: Reach ROM host
        run: |
          URL='https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.306.0.WFSINXM/ruan_in_global_images_OS3.0.306.0.WFSINXM_20261021.0000.00_16.0_in_e97cbecd4c.tgz'
          echo "--- HEAD"
          curl -sSIL --max-time 60 "$URL" | sed -n '1,25p'
          echo "--- size probe"
          curl -sS -r 0-1023 --max-time 60 -o /tmp/head.bin -w 'http=%{http_code} bytes=%{size_download}\n' "$URL" || echo "range GET failed"
          ls -l /tmp/head.bin 2>/dev/null || true
